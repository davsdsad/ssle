[project]
name = "ssle"
version = "2.0.0"
description = "SSLE-2 Nexus — from-scratch neural language model for PT titles (NumPy, no DL frameworks)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
